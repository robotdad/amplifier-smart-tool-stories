[project]
name = "amplifier-smart-tool-stories"
version = "0.1.0"
description = "Evidence-based HTML stories with shared agent and human review."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "amplifier-agent @ git+https://github.com/microsoft/amplifier-agent@44a83adeb49fc1cfb55eb0c1bf38aa125ff0d705",
  "openai>=1",
  "anthropic>=1.4",
  "google-genai>=1",
  "beautifulsoup4>=4.12",
  "PyYAML>=6",
  "weasyprint>=70.0",
  "pypdfium2>=5.13.0",
  "python-docx>=1.2",
  "Pillow>=11",
  "tinycss2>=1.4",
  "jsonschema>=4.23",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]
mcp = [
    "mcp>=2.2,<3",
]
[project.scripts]
stories = "amplifier_smart_tool_stories.cli:main"
stories-mcp = "amplifier_smart_tool_stories.mcp:main"
[project.urls]
Repository = "https://github.com/robotdad/amplifier-smart-tool-stories"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.build.targets.wheel]
packages = ["src/amplifier_smart_tool_stories"]
[tool.pytest.ini_options]
addopts = "-p no:amplifier_module"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
